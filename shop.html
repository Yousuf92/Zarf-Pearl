<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection — Zarf Pearl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">✦</span>
      <span class="brand-word">Zarf <span>Pearl</span></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Collection</a>
      <a href="index.html#story">Our Story</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="cart-link" href="cart.html">Cart <span class="cart-count">0</span></a>
    </div>
  </div>
</header>

<section style="padding-top:64px;padding-bottom:0;">
  <div class="wrap section-head">
    <span class="eyebrow">The Collection</span>
    <h2>Sea &amp; Cultivated Pearls</h2>
    <p>Akoya and South Sea pearls from Japan, and freshwater pearls from China — filter by type to browse.</p>
  </div>
</section>

<section style="padding-top:0;">
  <div class="wrap">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All Pieces</button>
      <button class="filter-btn" data-filter="Sea Pearl">Sea Pearls</button>
      <button class="filter-btn" data-filter="Cultivated Pearl">Cultivated Pearls</button>
      <button class="filter-btn" data-filter="Japan">From Japan</button>
      <button class="filter-btn" data-filter="China">From China</button>
    </div>
    <div class="grid" id="shop-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 Zarf Pearl. All rights reserved.</span>
    <span>Sea &amp; cultivated pearls, imported from Japan &amp; China.</span>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
