<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Zarf Pearl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">✦</span>
      <span class="brand-word">Zarf <span>Pearl</span></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Collection</a>
      <a href="index.html#story">Our Story</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="cart-link" href="cart.html">Cart <span class="cart-count">0</span></a>
    </div>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="section-head" style="margin-bottom:40px;">
      <span class="eyebrow">Step 1 of 2</span>
      <h2>Your Cart</h2>
    </div>

    <div class="cart-layout">
      <div>
        <div class="cart-list" id="cart-list"></div>
        <div class="empty-state" id="cart-empty" style="display:none;">
          <div class="empty-cart-icon"></div>
          <p>Your cart is empty right now.</p>
          <a href="shop.html" class="btn btn-primary">Browse the Collection</a>
        </div>
      </div>
      <div class="summary-card" id="cart-summary"></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 Zarf Pearl. All rights reserved.</span>
    <span>Sea &amp; cultivated pearls, imported from Japan &amp; China.</span>
  </div>

<script src="js/main.js"></script>

</html>
